<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7a4f"/>
      <stop offset="100%" style="stop-color:#1a5c35"/>
    </linearGradient>
  </defs>
  <!-- Clock circle -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#clockGrad)" stroke-width="3"/>
  <!-- Inner circle subtle -->
  <circle cx="24" cy="24" r="2" fill="#2d7a4f"/>
  <!-- Hour hand (pointing ~10) -->
  <line x1="24" y1="24" x2="16" y2="13"
        stroke="#2d7a4f" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand (pointing ~2) -->
  <line x1="24" y1="24" x2="33" y2="18"
        stroke="#1a5c35" stroke-width="2" stroke-linecap="round"/>
  <!-- Tick marks -->
  <line x1="24" y1="5" x2="24" y2="8" stroke="#2d7a4f" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="40" x2="24" y2="43" stroke="#2d7a4f" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="8" y2="24" stroke="#2d7a4f" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="24" x2="43" y2="24" stroke="#2d7a4f" stroke-width="2" stroke-linecap="round"/>
</svg>
